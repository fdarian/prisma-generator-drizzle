packages:
  - packages/*
  - examples/*

allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  lefthook: true
  prisma: true

# @prisma/generator's types import @prisma/dmmf but only list it as a devDependency
packageExtensions:
  '@prisma/generator':
    dependencies:
      '@prisma/dmmf': 7.10.1
